name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The published site sends visitors of the GitHub Pages address to www.nordwerk.studio,
      # which serves the same files under /oss/scroll-carousel.
      - run: pnpm site
        env:
          SITE_REDIRECT: '1'
      - run: pnpm size
      # publint and arethetypeswrong on the packed tarball: exports, types and files as published.
      - run: pnpm lint:package
      - run: pnpm fixtures
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
      # The fixtures are for the tests only; the rest of _site is the documentation site.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf _site/fixtures
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A fresh shadcn project installs the registry items through the CLI, builds and renders them.
  shadcn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/shadcn-smoke.mjs

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, shadcn]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
