name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp fmt --check .
      - run: pnpm exec vp lint
      - run: pnpm typecheck
      - run: pnpm test
      # GitHub Pages publishes _site/ under /oss-ui/ and sends its visitors to www.nordwerk.studio,
      # which shows each package's page at /oss/<name>.
      - run: pnpm site
        env:
          SITE_BASE: /oss-ui/
          SITE_REDIRECT: '1'
      - run: pnpm size
      - run: pnpm fixtures
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
      # The fixtures are for the tests only; the rest of _site is the documentation site.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf _site/*/fixtures
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A fresh shadcn project installs every registry item through the CLI, builds and renders them.
  shadcn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:shadcn

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, shadcn]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
